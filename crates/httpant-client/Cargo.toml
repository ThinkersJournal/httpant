[package]
name = "httpant-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["http", "client", "hyper", "abstraction"]
categories = ["web-programming::http-client", "network-programming"]
description = "HTTPAnt client half: the Client builder, the ClientAdapter trait and the hyper-util reference adapter"

[dependencies]
httpant-core.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }

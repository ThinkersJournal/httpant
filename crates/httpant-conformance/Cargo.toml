[package]
name = "httpant-conformance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTPAnt adapter conformance suite: cases run over real sockets, each with known-bad mutants, and an independent raw-TCP HTTP/1.1 client"
publish = false

[dependencies]
httpant-core.workspace = true
httpant-client = { workspace = true, features = ["https"] }
httpant-server = { workspace = true, features = ["axum", "actix-web", "poem", "salvo", "warp", "tls", "http2"] }
tower.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "sync"] }
bytes.workspace = true
futures-util.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1", "client", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }

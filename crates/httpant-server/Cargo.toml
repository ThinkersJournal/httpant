[package]
name = "httpant-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTPAnt server half: the Server builder, the ServerAdapter trait and the hyper reference adapter"

[features]
# Adapters other than the hyper reference are opt-in: a user pays only for the framework they pick.
axum = ["dep:axum"]
actix-web = ["dep:actix-web", "dep:futures-util", "dep:http-body-util"]
salvo = ["dep:salvo_core", "dep:futures-util", "dep:http-body-util"]
warp = ["dep:warp", "dep:bytes", "dep:futures-util", "dep:http-body-util"]
tls = ["dep:rustls", "dep:tokio-rustls"]
poem = ["dep:poem", "dep:futures-util", "dep:http-body-util"]

[dependencies]
httpant-core.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "macros", "time"] }
tower.workspace = true
axum = { workspace = true, optional = true, features = ["tokio", "http1"] }
actix-web = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
http-body.workspace = true
http-body-util = { workspace = true, optional = true }
poem = { workspace = true, optional = true, features = ["server"] }
warp = { workspace = true, optional = true, features = ["server"] }
bytes = { workspace = true, optional = true }
salvo_core = { workspace = true, optional = true, features = ["server", "server-handle", "http1"] }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
httpant-client.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

# Examples are built and run in CI; `test = true` also runs the unit tests inside them.
[[example]]
name = "hello"
test = true

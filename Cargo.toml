[workspace]
resolver = "3"
members = ["crates/httpant-core", "crates/httpant-server", "crates/httpant-client", "crates/httpant-conformance"]

[workspace.package]
# One number for every crate in the project (portfolio rule). 0.1.0: a new line, not a continuation of web-server-abstraction 1.0.x.
version = "0.5.7"
edition = "2024"
authors = ["Eric Evans <ciresnave@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/httpant"

[workspace.dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
axum = { version = "0.8", default-features = false }
actix-web = { version = "4", default-features = false }
poem = { version = "3", default-features = false }
salvo_core = { version = "1", default-features = false }
warp = { version = "0.4", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
httpant-core = { path = "crates/httpant-core", version = "0.5.7" }
httpant-server = { path = "crates/httpant-server", version = "0.5.7" }
httpant-client = { path = "crates/httpant-client", version = "0.5.7" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = { version = "0.18", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
thiserror = "2"
tokio = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-util = { version = "0.3", default-features = false }

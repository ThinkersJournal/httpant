[workspace]
resolver = "3"
members = ["crates/httpant-core", "crates/httpant-conformance"]

[workspace.package]
# Placeholder: the PM allocates the real number at gate (portfolio rule). One number for every crate in the project.
version = "1.0.11"
edition = "2024"
authors = ["Eric Evans <ciresnave@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/httpant"

[workspace.dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
thiserror = "2"
tokio = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-util = { version = "0.3", default-features = false }

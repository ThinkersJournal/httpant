# The root package is the one a stranger depends on: `cargo add httpant`. It is a thin facade over the member crates (httpant-core,
# httpant-server, httpant-client), which keep their names and paths.
[package]
name = "httpant"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTPAnt: serve HTTP and call HTTP once, on the web library you choose (hyper, axum, actix-web, poem, salvo, warp), with a conformance suite every adapter must pass"
readme = "README.md"
rust-version.workspace = true
keywords = ["http", "server", "client", "axum", "abstraction"]
categories = ["web-programming::http-server", "web-programming::http-client", "network-programming"]
# Only what a user of the crate needs; the rest of the repository (docs, ROADMAP, HANDOFF, CI files, the member crates) is not shipped with it.
include = ["src/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]

[features]
# The hyper adapter is always there. Each other web library is opt-in, so you pay compile time only for the one you pick.
axum = ["httpant-server/axum"]
actix-web = ["httpant-server/actix-web"]
poem = ["httpant-server/poem"]
salvo = ["httpant-server/salvo"]
warp = ["httpant-server/warp"]
# Terminate TLS in HTTPAnt (rustls), from a certificate source you provide.
tls = ["httpant-server/tls"]
# Serve HTTP/2 over TLS (needs `tls`).
http2 = ["httpant-server/http2"]
# Call https:// URLs from the client (rustls, bundled roots, certificates verified). Distinct from `tls`, which terminates TLS in the server.
https = ["httpant-client/https"]

[dependencies]
httpant-core.workspace = true
httpant-server.workspace = true
httpant-client.workspace = true

[dev-dependencies]
# examples/ is compiled and run in CI.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "hello"
test = true

[workspace]
resolver = "3"
members = ["crates/httpant-core", "crates/httpant-server", "crates/httpant-client", "crates/httpant-conformance", "crates/httpant-bench"]
# `cargo build`, `cargo test` and friends at the root cover every crate, as they did before there was a root package.
default-members = [".", "crates/httpant-core", "crates/httpant-server", "crates/httpant-client", "crates/httpant-conformance", "crates/httpant-bench"]

[workspace.package]
# One number for every crate in the project (portfolio rule). 0.1.0: a new line, not a continuation of web-server-abstraction 1.0.x.
version = "0.5.27"
edition = "2024"
# The default build (hyper only, no optional adapter). Measured on 1.88 and kept by the `msrv` job in CI; the optional adapters can need more:
# actix-web 1.89, salvo 1.94 and, through its dependencies, 1.95 with every feature on (cargo names the package that asks).
rust-version = "1.88"
authors = ["Eric Evans <ciresnave@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/httpant"

[workspace.dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
axum = { version = "0.8", default-features = false }
actix-web = { version = "4", default-features = false }
# The pieces under actix-web that TLS serving builds on (HttpService over streams HTTPAnt handshook itself); same versions actix-web already pulls.
actix-http = { version = "3", default-features = false }
actix-service = "2"
poem = { version = "3", default-features = false }
salvo_core = { version = "1", default-features = false }
warp = { version = "0.4", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
httpant-core = { path = "crates/httpant-core", version = "0.5.27" }
httpant-server = { path = "crates/httpant-server", version = "0.5.27" }
httpant-client = { path = "crates/httpant-client", version = "0.5.27" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Client https: hyper-rustls on the same rustls and ring as the server; roots bundled (webpki-roots), never read from the machine unless asked.
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = { version = "0.18", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
thiserror = "2"
serde = "1"
serde_urlencoded = "0.7"
tokio = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-util = { version = "0.3", default-features = false }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test, clippy, fmt, doc
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --locked --all-targets

      - name: cargo test
        run: cargo test --locked --no-fail-fast

      - name: httpant-server alone (hyper only, no optional adapters)
        run: cargo test --locked -p httpant-server --lib

      - name: hello-world example, run in CI
        run: cargo run --locked --example hello -p httpant-server

      - name: the `httpant` facade's hello-world (the one a stranger copies), run in CI
        run: cargo run --locked --example hello -p httpant

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      # The published shape. Each crate ships what is in its own directory, so the licence files are copies; they must be the repository's.
      - name: each crate ships the repository's licence files
        if: runner.os == 'Linux'
        run: |
          for c in httpant-core httpant-server httpant-client; do
            cmp LICENSE-MIT "crates/$c/LICENSE-MIT"
            cmp LICENSE-APACHE "crates/$c/LICENSE-APACHE"
          done

      # Package every publishable crate in dependency order and build each from its own tarball, resolving the workspace crates from the
      # tarballs just made (a dry run: nothing is uploaded). This is the first-release gate's "the package, not the checkout, works".
      - name: package and verify every publishable crate (dry run)
        if: runner.os == 'Linux'
        run: cargo publish --workspace --dry-run --locked

  # The minimum supported Rust version is a claim (`rust-version` in Cargo.toml), so it is checked, not asserted. The default build only: the
  # optional adapters can need a newer compiler (actix-web 1.89, salvo 1.94; every feature on, 1.95) and cargo names the package that asks.
  msrv:
    name: Minimum supported Rust (default build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.88.0

      - name: cargo check on the minimum version
        run: cargo check --locked -p httpant -p httpant-core -p httpant-server -p httpant-client --all-targets

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a full commit SHA (the tag v2.1.1, read from the action's repository on 2026-10-11).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  # Advisory (PM TASK 2026-10-24): NOT a required check and no rule is silenced here. The called workflow fixes the rule profile and the
  # CodeRipper version; this repository passes nothing (it is public, so the default GitHub-hosted runner is right).
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@a8e30cd2bbe74399a4ae5f70c43567c870a655a6 # coderipper main on 2026-10-26 (its portfolio.yml installs CodeRipper 0.10.x)
